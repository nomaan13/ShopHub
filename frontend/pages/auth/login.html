<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- External CSS -->
    
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>  

<div class="card" id="loginCard">
    <h4 class="text-center mb-4">Login</h4>

    <div class="d-flex toggle mb-4">
        <button class="btn flex-fill active" id="userBtn" onclick="setType('user')">
            <i class="fa fa-user"></i> User
        </button>
        <button class="btn flex-fill" id="adminBtn" onclick="setType('admin')">
            <i class="fa fa-shield-alt"></i> Admin
        </button>
    </div>

    <input class="form-control mb-3" id="email" placeholder="Email">
    <input class="form-control mb-3" type="password" id="password" placeholder="Password">

    <div id="loginError" class="text-danger mb-3" style="display:none;"></div>
    <!-- <button class="btn btn-primary w-100" type="button" onclick="login()">Login</button> -->
    <button id="loginBtn" type="button" class="btn btn-primary w-100" onclick="login()">
    Login
</button>



    <hr>
    <div class="text-center">
        <a href="register.html">Create Account</a>
    </div>
</div>

<!-- External JS -->
<!-- <script src="script.js"></script> -->
<script src="/js/login.js"></script>
</body>
</html>
