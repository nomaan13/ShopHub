<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../css/main.css">
</head>

<body>

<!-- Navbar -->
<div id="navbar"></div>

<!-- Checkout Section -->
<div class="container my-5">
    <h2 class="mb-4">Checkout</h2>

    <div class="row">
        <!-- LEFT SIDE -->
        <div class="col-md-8">

            <!-- Shipping Address -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="mb-3">Shipping Address</h5>

                    <form id="addressForm">
                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullName" required>
                                <small class="text-danger" id="nameError"></small>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Mobile</label>
                                <input type="text" class="form-control" id="mobile" required>
                                <small class="text-danger" id="mobileError"></small>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Address</label>
                                <input type="text" class="form-control" id="address" required>
                                <small class="text-danger" id="addressError"></small>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">City</label>
                                <input type="text" class="form-control" id="city" required>
                                <small class="text-danger" id="cityError"></small>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">State</label>
                                <input type="text" class="form-control" id="state" required>
                                <small class="text-danger" id="stateError"></small>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Pincode</label>
                                <input type="text" class="form-control" id="pincode" required>
                                <small class="text-danger" id="pincodeError"></small>
                            </div>

                        </div>
                    </form>
                </div>
            </div>

            <!-- Payment -->
            <div class="card">
                <div class="card-body">
                    <h5 class="mb-3">Payment Method</h5>

                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="payment" value="COD" checked>
                        <label class="form-check-label">Cash on Delivery</label>
                    </div>

                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="payment" value="CARD">
                        <label class="form-check-label">Card</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="payment" value="UPI">
                        <label class="form-check-label">UPI</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="col-md-4">
            <div class="card sticky-top" style="top: 100px;">
                <div class="card-body">

                    <h5 class="mb-3">Order Summary</h5>
                    <hr>

                    <div id="cartItems"></div>

                    <div class="d-flex justify-content-between">
                        <span>Subtotal</span>
                        <span id="subtotal">₹0</span>
                    </div>

                    <div class="d-flex justify-content-between fw-bold mt-2">
                        <span>Total</span>
                        <span id="total">₹0</span>
                    </div>

                    <button class="btn btn-success w-100 mt-4" onclick="placeOrder()">
                        Place Order
                    </button>

                    <a href="cart.html" class="btn btn-outline-secondary w-100 mt-2">
                        Back to Cart
                    </a>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div id="footer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/main.js"></script>

<script>
/* ================= LOAD CART ================= */
function loadCartSummary() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const cartItems = document.getElementById('cartItems');
    let subtotal = 0;

    if (cart.length === 0) {
        cartItems.innerHTML = '<p class="text-danger">Cart is empty</p>';
        return;
    }

    cartItems.innerHTML = '';
    cart.forEach(item => {
        const total = item.price * item.quantity;
        subtotal += total;
        cartItems.innerHTML += `
            <div class="d-flex justify-content-between mb-2">
                <span>${item.name} × ${item.quantity}</span>
                <span>₹${total}</span>
            </div>
        `;
    });

    document.getElementById('subtotal').innerText = '₹' + subtotal;
    document.getElementById('total').innerText = '₹' + subtotal;
}

/* ================= VALIDATION ================= */
function validateForm() {
    let valid = true;

    if (fullName.value.length < 3) {
        nameError.innerText = 'Invalid name';
        valid = false;
    } else nameError.innerText = '';

    if (!/^\d{10}$/.test(mobile.value)) {
        mobileError.innerText = 'Invalid mobile';
        valid = false;
    } else mobileError.innerText = '';

    if (address.value.length < 5) {
        addressError.innerText = 'Invalid address';
        valid = false;
    } else addressError.innerText = '';

    if (city.value.length < 2) {
        cityError.innerText = 'Invalid city';
        valid = false;
    } else cityError.innerText = '';

    if (state.value.length < 2) {
        stateError.innerText = 'Invalid state';
        valid = false;
    } else stateError.innerText = '';

    if (!/^\d{6}$/.test(pincode.value)) {
        pincodeError.innerText = 'Invalid pincode';
        valid = false;
    } else pincodeError.innerText = '';

    return valid;
}

/* ================= PLACE ORDER ================= */
function placeOrder() {
    if (!validateForm()) {
        alert("Fix errors first");
        return;
    }

    const cart = JSON.parse(localStorage.getItem('cart')) || [];

    let totalAmount = 0;
    cart.forEach(item => {
        totalAmount += item.price * item.quantity;
    });

    const orderData = {
        userName: fullName.value,
        totalAmount: totalAmount
    };

    fetch("http://localhost:8080/orders/place", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(orderData)
    })
    .then(res => res.json())
    .then(data => {
        
        localStorage.setItem("orderPlaced", "true");
        localStorage.setItem("orderId", data.orderId);

        // clear cart
        localStorage.removeItem("cart");

        // redirect
        window.location.href =
            "../order/order_confirmation.html?orderId=" + data.orderId;
    })
    .catch(err => {
        console.error(err);
        alert("Order failed");
    });
}

/* ================= INIT ================= */
document.addEventListener('DOMContentLoaded', loadCartSummary);
</script>

</body>
</html>
