<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin – Manage Products</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Your common CSS -->
    <link rel="stylesheet" href="../../css/main.css">
</head>

<body class="d-flex flex-column min-vh-100">

<!-- Navbar -->
<div id="navbar"></div>

<main class="flex-fill">
<div class="container mt-4">

    <!-- PAGE HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Manage Products</h3>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal">
            <i class="fa fa-plus"></i> Add Product
        </button>
    </div>

    <!-- SEARCH + PAGINATION -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <input type="text" id="searchInput" class="form-control w-50" placeholder="Search products...">
        <nav>
            <ul class="pagination mb-0" id="pagination"></ul>
        </nav>
    </div>

    <!-- PRODUCT TABLE -->
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="productTableBody">
                <!-- Filled by admin_products.js -->
            </tbody>
        </table>
    </div>

</div>
</main>

<!-- ADD / EDIT PRODUCT MODAL -->

<!-- Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="modalTitle" class="modal-title">Add Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="productId">

        <div class="row">
          <div class="col-md-6 mb-2">
            <label class="form-label">Name</label>
            <input type="text" id="name" class="form-control">
          </div>
          <div class="col-md-6 mb-2">
            <label class="form-label">Price</label>
            <input type="number" id="price" class="form-control">
          </div>
          <div class="col-md-6 mb-2">
            <label class="form-label">Stock</label>
            <input type="number" id="stock" class="form-control">
          </div>
          <div class="col-md-6 mb-2">
            <label class="form-label">Category</label>
            <!-- ✅ Dropdown instead of text input -->
            <select id="category" class="form-control"></select>
          </div>
          <div class="col-md-6 mb-2">
            <label class="form-label">Image URL</label>
            <input type="text" id="imageUrl" class="form-control">
          </div>
          <div class="col-md-12 mb-2">
            <label class="form-label">Description</label>
            <textarea id="description" class="form-control"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success" onclick="saveProduct()">Save</button>
      </div>
    </div>
  </div>
</div>


<div class="toast-container position-fixed bottom-0 end-0 p-3">
     <div id="successToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true"> 
        <div class="d-flex"> 
            <div class="toast-body" id="toastMessage">
                 <!-- Message will be injected here --> </div>
                   <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button> 
            </div>
        </div>
    </div>

<!-- Footer -->
<div id="footer"></div>

<!-- ADMIN GUARD -->
<script>
const user = JSON.parse(localStorage.getItem("loggedInUser"));
if (!user || user.role !== "ROLE_ADMIN") {
    window.location.href = "/pages/auth/login.html";
}
</script>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/main.js"></script>
<script src="../../js/admin_products.js"></script>

</body>
</html>
