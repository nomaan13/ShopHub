<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Management Dashboard | Admin Panel</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3a0ca3;
      --success-color: #4cc9f0;
      --warning-color: #f8961e;
      --danger-color: #f72585;
      --light-bg: #f8f9fa;
      --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f5f7fb;
      color: #333;
      line-height: 1.6;
      padding: 20px;
    }
    
    /* Header Styles */
    .admin-header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 1.5rem;
      margin-bottom: 2rem;
      border-radius: 12px;
      box-shadow: var(--card-shadow);
    }
    
    .admin-header h1 {
      font-weight: 600;
      font-size: 1.8rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .admin-header h1 i {
      font-size: 1.5rem;
    }
    
    /* Statistics Cards */
    .stats-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    
    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 1.2rem;
      box-shadow: var(--card-shadow);
      transition: var(--transition);
      border-left: 4px solid var(--primary-color);
      text-align: center;
    }
    
    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
    }
    
    .stat-card.pending { border-left-color: var(--warning-color); }
    .stat-card.shipped { border-left-color: var(--success-color); }
    .stat-card.delivered { border-left-color: #2ecc71; }
    .stat-card.cancelled { border-left-color: var(--danger-color); }
    
    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 0.5rem 0;
    }
    
    .stat-label {
      color: #666;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    /* Table Container */
    .table-container {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: var(--card-shadow);
      margin-bottom: 2rem;
    }
    
    .table-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #eee;
    }
    
    .table-title h2 {
      font-weight: 600;
      font-size: 1.3rem;
      margin: 0;
      color: #333;
    }
    
    /* Status Dropdown Styling */
    .status-select {
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      border: 2px solid #e9ecef;
      background-color: white;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      min-width: 120px;
    }
    
    .status-select.placed {
      border-color: rgba(248, 150, 30, 0.3);
      color: var(--warning-color);
    }
    
    .status-select.shipped {
      border-color: rgba(76, 201, 240, 0.3);
      color: var(--success-color);
    }
    
    .status-select.delivered {
      border-color: rgba(46, 204, 113, 0.3);
      color: #2ecc71;
    }
    
    .status-select.cancelled {
      border-color: rgba(247, 37, 133, 0.3);
      color: var(--danger-color);
    }
    
    .status-select:hover, .status-select:focus {
      border-color: var(--primary-color);
      outline: none;
      box-shadow: 0 0 0 0.2rem rgba(67, 97, 238, 0.1);
    }
    
    /* Table Styles */
    .table {
      margin-bottom: 0;
      border-collapse: separate;
      border-spacing: 0;
    }
    
    .table thead {
      background-color: #f8f9fa;
    }
    
    .table thead th {
      border-bottom: 2px solid #dee2e6;
      font-weight: 600;
      color: #495057;
      padding: 1rem;
      white-space: nowrap;
    }
    
    .table tbody tr {
      transition: var(--transition);
    }
    
    .table tbody tr:hover {
      background-color: rgba(67, 97, 238, 0.03);
    }
    
    .table tbody td {
      padding: 1rem;
      vertical-align: middle;
      border-top: 1px solid #f1f3f4;
    }
    
    /* Action Button */
    .btn-view {
      background-color: rgba(52, 152, 219, 0.1);
      color: #3498db;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      transition: var(--transition);
      cursor: pointer;
    }
    
    .btn-view:hover {
      background-color: #3498db;
      color: white;
    }
    
    /* Footer */
    .admin-footer {
      text-align: center;
      padding: 1.5rem;
      color: #666;
      font-size: 0.9rem;
      margin-top: 2rem;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }
      
      .stats-cards {
        grid-template-columns: 1fr;
      }
      
      .table-title {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
      
      .table-responsive {
        overflow-x: auto;
      }
      
      .table thead th, .table tbody td {
        padding: 0.75rem;
      }
    }
  </style>
</head>

<body>
  <!-- Header -->
  <div class="admin-header">
    <h1><i class="fas fa-boxes"></i> Order Management</h1>
  </div>
  
  <!-- Statistics Cards -->
  <div class="stats-cards">
    <div class="stat-card pending">
      <div class="stat-value" id="pendingOrders">0</div>
      <div class="stat-label">Placed Orders</div>
    </div>
    
    <div class="stat-card shipped">
      <div class="stat-value" id="shippedOrders">0</div>
      <div class="stat-label">Shipped</div>
    </div>
    
    <div class="stat-card delivered">
      <div class="stat-value" id="deliveredOrders">0</div>
      <div class="stat-label">Delivered</div>
    </div>
    
    <div class="stat-card cancelled">
      <div class="stat-value" id="cancelledOrders">0</div>
      <div class="stat-label">Cancelled</div>
    </div>
  </div>
  
  <!-- Orders Table -->
  <div class="table-container">
    <div class="table-title">
      <h2><i class="fas fa-list-alt me-2"></i> All Orders</h2>
      <div id="orderCount" class="text-muted">Loading orders...</div>
    </div>
    
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer Name</th>
            <th>Total Amount</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody">
          <!-- Orders will be loaded here dynamically -->
        </tbody>
      </table>
    </div>
  </div>
  
  <!-- Footer -->
  <div class="admin-footer">
    <p>© 2023 ShopHub Admin Panel</p>
  </div>
  
  <!-- Bootstrap & JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Your admin_orders.js -->
  <script src="../../js/admin_orders.js"></script>
</body>
</html>
