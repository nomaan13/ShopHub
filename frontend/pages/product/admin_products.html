<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Products</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../../css/main.css">
</head>

<body class="d-flex flex-column min-vh-100">

<!-- Navbar -->
<div id="navbar"></div>

<main class="flex-fill">
  <div class="container mt-4">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h3 class="mb-0">Product Catalog</h3>

      <!-- Admin-only buttons -->
      <div id="adminControls" class="btn-group d-none">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal">
          <i class="fa fa-plus"></i> Add Product
        </button>

        <a href="../order/admin_orders.html" class="btn btn-success">
          <i class="fa fa-box"></i> View All Orders
        </a>

        <a href="admin_users.html" class="btn btn-info text-white">
          <i class="fa fa-users"></i> Manage Users
        </a>

        <button class="btn btn-danger" onclick="adminLogout()">
          <i class="fa fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>

    <!-- PRODUCT TABLE -->
    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Price</th>
          <th>Category</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="productTableBody">
        <!-- Loaded via JS -->
      </tbody>
    </table>
  </div>

  <!-- ADD / EDIT MODAL -->
  <div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Add Product</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <input type="hidden" id="productId">

          <div class="mb-2">
            <label>Name</label>
            <input type="text" id="name" class="form-control">
          </div>

          <div class="mb-2">
            <label>Price</label>
            <input type="number" id="price" class="form-control">
          </div>  

          <div class="mb-2">
            <label>Category</label>
            <input type="text" id="category" class="form-control">
          </div>

          <div class="mb-2">
            <label>Image URL</label>
            <input type="text" id="imageUrl" class="form-control">
          </div>

          <div class="mb-2">
            <label>Description</label>
            <textarea id="description" class="form-control" rows="3"></textarea>
          </div>  

          <div class="mb-2">
            <label>Stock</label>
            <input type="number" id="stock" class="form-control">
          </div>                      
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-success" onclick="saveProduct()">Save</button>
        </div>

      </div>
    </div>
  </div>
</main>

<!-- Footer -->
<div id="footer"></div>

<script>
  const user = JSON.parse(localStorage.getItem("loggedInUser"));

  // If not logged in, redirect
  if (!user) {
    window.location.href = "/pages/auth/login.html";
  }

  // Show admin controls only if role is admin
  if (user && user.role === "ROLE_ADMIN") {
    document.getElementById("adminControls").classList.remove("d-none");
  }
</script>

<script src="/js/main.js"></script>
<script src="/js/admin_products.js"></script> 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
